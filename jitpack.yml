# JitPack builds this repo on demand when someone requests a tagged version: it checks out the tag,
# runs the install command below under the JDK here, and re-hosts whatever the build installs into
# the local Maven repo — serving it as `com.github.primandproper.primitives-kt:<module>:<tag>`.
#
# `-PjvmOnly` excludes the Android-library modules from the build (see settings.gradle.kts), so
# JitPack only ever compiles the pure-JVM modules and never needs the Android SDK. That's what lets
# a server/JVM project consume these artifacts without any Android tooling on either side.
#
# Division of labor: this JitPack flow serves the pure-JVM modules (no Android tooling required),
# and the ten Android `.aar` modules are published to GitHub Packages by a dedicated tag-triggered
# CI job (.github/workflows/publish.yml — P1-7's option B). That job reuses CI's Android SDK setup
# and runs the full (non-jvmOnly) publish, so a failure there can never regress this JVM flow. See
# README → "Android modules" for the GitHub Packages coordinates and consumer setup.
jdk:
  - openjdk17
install:
  - ./gradlew publishToMavenLocal -PjvmOnly
